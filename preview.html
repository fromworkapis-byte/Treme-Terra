      --border: #1e293b;

    .bg-primary { background-color: var(--bg-primary); }
    .bg-secondary { background-color: var(--bg-secondary); }
    .bg-tertiary { background-color: var(--bg-tertiary); }
    .text-primary { color: var(--text-primary); }
    .text-secondary { color: var(--text-secondary); }
    .text-muted { color: var(--text-muted); }
    .border-custom { border-color: var(--border); }
    .border-hover:hover { border-color: var(--border-hover); }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: var(--bg-primary); }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }
    .delay-5 { animation-delay: 0.25s; }
    .delay-6 { animation-delay: 0.3s; }
    .chart-container { position: relative; height: 280px; width: 100%; }

    // ===== CHARTS (Canvas-based for simplicity) =====
    const AreaChart = ({ data, color = 'green' }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const ctx = canvasRef.current.getContext('2d');
        const { width, height } = canvasRef.current.getBoundingClientRect();
        canvasRef.current.width = width * 2;
        canvasRef.current.height = height * 2;
        ctx.scale(2, 2);

        const maxVal = Math.max(...data.map(d => d.balance));
        const minVal = Math.min(...data.map(d => d.balance));
        const range = maxVal - minVal || 1;
        const padding = 20;
        const w = width - padding * 2;
        const h = height - padding * 2;

        ctx.clearRect(0, 0, width, height);

        // Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        if (color === 'green') {
          gradient.addColorStop(0, 'rgba(16, 185, 129, 0.3)');
          gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');
        } else {
          gradient.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
          gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');
        }

        // Path
        ctx.beginPath();
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          const y = padding + h - ((d.balance - minVal) / range) * h;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.lineTo(padding + w, padding + h);
        ctx.lineTo(padding, padding + h);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        // Line
        ctx.beginPath();
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          const y = padding + h - ((d.balance - minVal) / range) * h;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = color === 'green' ? '#10b981' : '#3b82f6';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Dots
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          const y = padding + h - ((d.balance - minVal) / range) * h;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = color === 'green' ? '#10b981' : '#3b82f6';
          ctx.fill();
        });
      }, [data, color]);
      return <canvas ref={canvasRef} className="w-full h-full" />;
    };

    const BarChart = ({ data }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const ctx = canvasRef.current.getContext('2d');
        const { width, height } = canvasRef.current.getBoundingClientRect();
        canvasRef.current.width = width * 2;
        canvasRef.current.height = height * 2;
        ctx.scale(2, 2);

        const maxVal = Math.max(...data.flatMap(d => [d.income, d.expense]));
        const padding = 40;
        const w = width - padding * 2;
        const h = height - padding * 2;
        const barW = w / data.length * 0.6;
        const gap = w / data.length * 0.4;

        ctx.clearRect(0, 0, width, height);

        // Grid lines
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = padding + (h / 4) * i;
          ctx.beginPath();
          ctx.moveTo(padding, y);
          ctx.lineTo(padding + w, y);
          ctx.stroke();
        }

        data.forEach((d, i) => {
          const x = padding + i * (barW * 2 + gap) + gap / 2;
          const incomeH = (d.income / maxVal) * h;
          const expenseH = (d.expense / maxVal) * h;

          // Income bar
          const grad1 = ctx.createLinearGradient(0, padding + h - incomeH, 0, padding + h);
          grad1.addColorStop(0, '#34d399');
          grad1.addColorStop(1, '#10b981');
          ctx.fillStyle = grad1;
          ctx.fillRect(x, padding + h - incomeH, barW, incomeH);

          // Expense bar
          const grad2 = ctx.createLinearGradient(0, padding + h - expenseH, 0, padding + h);
          grad2.addColorStop(0, '#f87171');
          grad2.addColorStop(1, '#ef4444');
          ctx.fillStyle = grad2;
          ctx.fillRect(x + barW, padding + h - expenseH, barW, expenseH);

          // Label
          ctx.fillStyle = '#64748b';
          ctx.font = '11px Inter';
          ctx.textAlign = 'center';
          ctx.fillText(d.month, x + barW, padding + h + 18);
        });

        // Legend
        ctx.font = '12px Inter';
        ctx.fillStyle = '#10b981';
        ctx.fillRect(width - 160, 16, 12, 12);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Entradas', width - 144, 25);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(width - 80, 16, 12, 12);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Despesas', width - 64, 25);
      }, [data]);
      return <canvas ref={canvasRef} className="w-full h-full" />;
    };

    const DonutChart = ({ data }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const ctx = canvasRef.current.getContext('2d');
        const { width, height } = canvasRef.current.getBoundingClientRect();
        const size = Math.min(width, height);
        canvasRef.current.width = size * 2;
        canvasRef.current.height = size * 2;
        ctx.scale(2, 2);
        ctx.translate(size / 2, size / 2);
        const radius = size / 2 - 20;
        const innerRadius = radius * 0.6;

        const total = data.reduce((s, d) => s + d.value, 0);
        let startAngle = -Math.PI / 2;

        data.forEach(d => {
          const sliceAngle = (d.value / total) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(0, 0, radius, startAngle, startAngle + sliceAngle);
          ctx.arc(0, 0, innerRadius, startAngle + sliceAngle, startAngle, true);
          ctx.closePath();
          ctx.fillStyle = d.color;
          ctx.fill();
          startAngle += sliceAngle;
        });
      }, [data]);
      return <canvas ref={canvasRef} className="w-full h-full mx-auto" />;
    };

    const LineChart = ({ data }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const ctx = canvasRef.current.getContext('2d');
        const { width, height } = canvasRef.current.getBoundingClientRect();
        canvasRef.current.width = width * 2;
        canvasRef.current.height = height * 2;
        ctx.scale(2, 2);

        const maxVal = Math.max(...data.flatMap(d => [d.income, d.expense]));

        const w = width - padding * 2;
        const h = height - padding * 2;

        ctx.clearRect(0, 0, width, height);

        // Grid

        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = padding + (h / 4) * i;
          ctx.beginPath();
          ctx.moveTo(padding, y);
          ctx.lineTo(padding + w, y);
          ctx.stroke();
        }

        // Income line
        const grad1 = ctx.createLinearGradient(0, 0, 0, height);
        grad1.addColorStop(0, '#34d399');
        grad1.addColorStop(1, '#10b981');
        ctx.beginPath();
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          const y = padding + h - (d.income / maxVal) * h;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = grad1;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Expense line
        const grad2 = ctx.createLinearGradient(0, 0, 0, height);
        grad2.addColorStop(0, '#f87171');
        grad2.addColorStop(1, '#ef4444');
        ctx.beginPath();
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          const y = padding + h - (d.expense / maxVal) * h;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = grad2;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Dots
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          const y1 = padding + h - (d.income / maxVal) * h;
          const y2 = padding + h - (d.expense / maxVal) * h;
          [y1, y2].forEach((y, idx) => {
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#0a0f1a';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fillStyle = idx === 0 ? '#10b981' : '#ef4444';
            ctx.fill();
          });
        });

        // Labels
        ctx.fillStyle = '#64748b';
        ctx.font = '11px Inter';
        ctx.textAlign = 'center';
        data.forEach((d, i) => {
          const x = padding + (i / (data.length - 1)) * w;
          ctx.fillText(d.year, x, padding + h + 20);
        });

        // Legend
        ctx.font = '12px Inter';
        ctx.fillStyle = '#10b981';
        ctx.fillRect(width - 160, 16, 12, 12);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Entradas', width - 144, 25);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(width - 80, 16, 12, 12);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Despesas', width - 64, 25);
      }, [data]);
      return <canvas ref={canvasRef} className="w-full h-full" />;
    };

                      <td className="py-3"><Badge variant="gray" style={{ backgroundColor: m.categoryColor + '20', color: m.categoryColor }}>{m.category || (m.from ? `${m.from} → ${m.to}` : '-')}</Badge></td>
                      <td className="py-3 text-right font-mono font-medium">
                        {m.type === 'entry' && <span className="text-green-400">+{formatBRL(m.amount)}</span>}
                        {m.type === 'expense' && <span className="text-red-400">-{formatBRL(m.amount)}</span>}
                        {m.type === 'transfer' && <span className="text-yellow-400">{formatBRL(m.amount)}</span>}
                      </td>
                      <td className="py-3 text-secondary">{m.account || '-'}</td>
                      <td className="py-3">
                        {m.type === 'entry' && <Badge variant="green">Entrada</Badge>}
                        {m.type === 'expense' && <Badge variant="red">Despesa</Badge>}
                        {m.type === 'transfer' && <Badge variant="yellow">Transferência</Badge>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    };

    const PlaceholderPage = ({ title, icon: Icon, description }) => (
      <div className="p-4 lg:p-6">
        <div className="flex items-center gap-4 mb-8">
          <div className="p-3 rounded-xl bg-tertiary"><Icon className="w-7 h-7 text-secondary" /></div>
          <div>
            <h1 className="text-2xl lg:text-3xl font-bold text-primary">{title}</h1>
            <p className="text-secondary mt-1">{description}</p>
          </div>
        </div>
        <Card>
          <div className="text-center py-12">
            <Icons.AlertCircle className="w-12 h-12 text-muted mx-auto mb-4 opacity-50" />
            <h3 className="text-lg font-medium text-primary mb-2">Em desenvolvimento</h3>
            <p className="text-secondary mb-6">Esta funcionalidade será implementada na próxima fase.</p>
            <Button variant="primary"><Icons.Plus /> Nova {title.slice(0, -1)}</Button>
          </div>
        </Card>
      </div>
    );

    // ===== MAIN APP =====
    const App = () => {
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');

      const pages = {
        dashboard: <Dashboard />,
        entries: <PlaceholderPage title="Entradas" icon={Icons.ArrowDownLeft} description="Registre e gerencie todos os recebimentos do grêmio" />,
        expenses: <PlaceholderPage title="Despesas" icon={Icons.ArrowUpRight} description="Controle todos os gastos e anexe comprovantes" />,
        movements: <PlaceholderPage title="Movimentações" icon={Icons.ArrowLeftRight} description="Histórico completo de todas as operações financeiras" />,
        accounts: <PlaceholderPage title="Contas e Caixa" icon={Icons.Wallet} description="Gerencie contas bancárias, caixa físico e transferências" />,
        members: <PlaceholderPage title="Integrantes" icon={Icons.Users} description="Cadastre integrantes e acompanhe contribuições mensais" />,
        reports: <PlaceholderPage title="Relatórios" icon={Icons.FileText} description="Gere relatórios em PDF e Excel para prestação de contas" />,
        audit: <PlaceholderPage title="Auditoria" icon={Icons.Shield} description="Histórico imutável de todas as alterações financeiras" />,
        settings: <PlaceholderPage title="Configurações" icon={Icons.Settings} description="Configure categorias, usuários, backup e preferências" />,
      };

      return (
        <div className="min-h-screen flex">
          <Sidebar isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} currentPage={currentPage} onNavigate={setCurrentPage} />
          <div className="flex-1 flex flex-col min-w-0 lg:ml-0">
            <Header onMenuClick={() => setSidebarOpen(true)} onSearch={() => {}} searchQuery={searchQuery} setSearchQuery={setSearchQuery} />
            <main className="flex-1 overflow-y-auto bg-primary">
              {pages[currentPage]}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
